services:
  - type: web
    name: dynamic-risk-intelligence
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 120
    envVars:
      - key: FLASK_DEBUG
        value: "0"
      - key: DRISTI_SECRET_KEY
        generateValue: true
